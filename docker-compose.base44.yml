services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: onepiece
      POSTGRES_PASSWORD: onepiece_dev_password
      POSTGRES_DB: onepiece
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onepiece -d onepiece']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: node:22
    working_dir: /app
    restart: on-failure
    # Platform-delivered secrets (JWT_SECRET) live outside the repo.
    env_file:
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      PORT: '4000'
      DATABASE_URL: postgres://onepiece:onepiece_dev_password@db:5432/onepiece
      COOKIE_SECURE: '0'
      BASE44_PREVIEW_MODE:
    volumes:
      - ./server:/app
      - api_node_modules:/app/node_modules
    command: ['sh', '-ec', 'npm ci --no-audit --no-fund && exec npm run dev']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    labels:
      base44.project: 'API'
      base44.kind: api
      base44.port: '4000'

  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    environment:
      # Vite needs the sandbox host wildcard and the preview origin to accept the
      # proxied preview traffic; both are only read in preview mode.
      BASE44_PREVIEW_MODE:
      BASE44_SANDBOX_HOST_DOMAIN:
      BASE44_PUBLIC_HOST_SUFFIX:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
      API_INTERNAL_URL: http://api:4000
    volumes:
      - ./client:/app
      - web_node_modules:/app/node_modules
    command: ['sh', '-ec', 'npm ci --no-audit --no-fund && exec npm run dev']
    ports:
      - '3000:5173'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    labels:
      base44.project: 'Grand Line Legends'
      base44.kind: web
      base44.port: '3000'

volumes:
  db_data:
  api_node_modules:
  web_node_modules:
